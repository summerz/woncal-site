name: Update woncal site

on:
  schedule:
    - cron: '37 5 * * *' # 14:37 Asia/Seoul; avoid the top of the hour
  workflow_dispatch:
    inputs:
      backfill_limit:
        description: 'Older posts to process when there are no new posts'
        required: true
        default: 5
        type: number
      force_post_id:
        description: 'Existing post ID to re-read, including image OCR (optional)'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: woncal-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: macos-latest
    steps:
      - name: Check out private source
        uses: actions/checkout@v7
        with:
          repository: summerz/woncal
          ref: main
          path: source
          ssh-key: ${{ secrets.WONCAL_SOURCE_DEPLOY_KEY }}
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: source/package-lock.json
      - name: Build OCR tool
        working-directory: source
        run: swiftc scripts/ocr.swift -o "$RUNNER_TEMP/woncal-ocr"
      - name: Read new posts or older posts
        working-directory: source
        env:
          BACKFILL_LIMIT: ${{ inputs.backfill_limit || 5 }}
          FORCE_POST_ID: ${{ inputs.force_post_id }}
        run: |
          args=(--limit 10 --backfill-limit "$BACKFILL_LIMIT" --ocr-bin "$RUNNER_TEMP/woncal-ocr")
          if [[ -n "$FORCE_POST_ID" ]]; then
            args+=(--force-post-id "$FORCE_POST_ID")
          fi
          python3 scripts/sync.py "${args[@]}"
      - name: Save extracted data privately
        working-directory: source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/posts.json data/sync-state.json public/data.json
          if ! git diff --cached --quiet; then
            git commit -m "Update field news data"
            git push origin HEAD:main
          fi
      - name: Build website
        working-directory: source
        env:
          GITHUB_PAGES_BASE: /
        run: |
          npm ci
          npm run build
      - name: Check out published branch
        uses: actions/checkout@v7
        with:
          ref: gh-pages
          path: site
          ssh-key: ${{ secrets.WONCAL_SITE_DEPLOY_KEY }}
          persist-credentials: true
      - name: Publish changed files
        run: |
          git -C site config user.name "github-actions[bot]"
          git -C site config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C site rm -r --ignore-unmatch .
          cp -R source/dist/. site/
          touch site/.nojekyll
          printf 'woncal.summerz.net\n' > site/CNAME
          git -C site add -A
          if ! git -C site diff --cached --quiet; then
            git -C site commit -m "Publish woncal site"
            git -C site push origin HEAD:gh-pages
          fi
      - name: Check out public main
        uses: actions/checkout@v7
        with:
          ref: main
          path: site-main
          ssh-key: ${{ secrets.WONCAL_SITE_DEPLOY_KEY }}
          persist-credentials: true
      - name: Record successful daily check
        run: |
          mkdir -p site-main/.automation
          python3 - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          source = json.loads(Path('source/public/data.json').read_text(encoding='utf-8'))
          status = {
              'checkedAt': datetime.now(timezone.utc).isoformat(),
              'dataGeneratedAt': source['generatedAt'],
              'workflowRun': f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
          }
          Path('site-main/.automation/last-success.json').write_text(
              json.dumps(status, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY
          git -C site-main config user.name "github-actions[bot]"
          git -C site-main config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C site-main add .automation/last-success.json
          git -C site-main commit -m "Record daily source check"
          git -C site-main push origin HEAD:main
